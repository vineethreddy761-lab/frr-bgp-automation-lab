name: FRR BGP Automation CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Step 1 - Install required dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install infrastructure and validation packages if needed
          pip install pytest pyyaml requests

      - name: Step 2 - Configure setup environment validation
        run: |
          echo "Verifying project file structure..."
          ls -la
          python3 -c "import yaml; print('PyYAML is working correctly')"

      - name: Step 3 - Run static checks and syntax tests
        run: |
          echo "Checking Python script syntax..."
          python3 -m py_compile *.py
          
          if [ -f pipeline.py ]; then
            echo "Pipeline script exists and is syntactically correct."
          fi

      - name: Step 4 - Connect and simulate integration check
        run: |
          echo "Simulating pipeline execution checks..."
          if [ -f bgp_monitor.py ]; then
            python3 -c "import bgp_monitor; print('BGP monitor module loaded successfully')"
          fi
          echo "Pipeline workflow validation completed successfully!"
